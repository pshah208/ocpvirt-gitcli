---
# Local Storage Operator (LSO) Subscription
# LSO discovers local disks on nodes and creates PersistentVolumes.
# Use with the hostpath provisioner for RWO storage in lab environments.
# Reference: https://docs.openshift.com/container-platform/latest/storage/persistent_storage/persistent_storage_local/
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-local-storage
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: local-operator-group
  namespace: openshift-local-storage
spec:
  targetNamespaces:
    - openshift-local-storage
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: local-storage-operator
  namespace: openshift-local-storage
spec:
  channel: "stable"
  installPlanApproval: Automatic
  name: local-storage-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
