# aws-small.vars.yaml — small AWS cluster for dev/test
# Render: VARS_FILE=examples/aws-small.vars.yaml bash scripts/render.sh \
#           templates/install-config/aws.install-config.yaml.tmpl \
#           /tmp/aws-small/install-config.yaml
---
goal: ocp-only
platform: aws
topology: standard
ocp_version: "4.16"
cluster_name: ocp4-small
base_domain: example.com

cp_count: 3
cp_vcpu: 4
cp_ram_gib: 16
cp_disk: 120

worker_count: 3
worker_vcpu: 8
worker_ram_gib: 32
worker_disk: 120
worker_cnv_dedicated: false

cluster_cidr: 10.128.0.0/14
service_cidr: 172.30.0.0/16
machine_cidr: 10.0.0.0/16
network_type: OVNKubernetes
mtu: 1450

aws_region: us-east-1
aws_zone_a: us-east-1a
aws_zone_b: us-east-1b
aws_zone_c: us-east-1c
aws_cp_instance_type: m6i.xlarge
aws_worker_instance_type: m6i.2xlarge

load_balancer: cloud-managed
storage: cloud

# Secret paths (never inline values here)
pull_secret_path: .secrets/pull-secret.json
ssh_key_path: ~/.ssh/id_rsa.pub

cnv_enabled: false
cnv_rwx_storage_class: ""
cnv_install_nmstate: false
cnv_install_metallb: false
